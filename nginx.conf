server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compacta para carregar mais rápido
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Cabeçalhos de segurança (aplicados a todas as respostas) ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Câmera e localização liberadas só para o próprio site (candidato tira foto por 'capture')
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    # CSP inclui os domínios do Firebase (Storage/Firestore) para fotos e dados funcionarem
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://images.unsplash.com https://ui-avatars.com https://api.qrserver.com https://firebasestorage.googleapis.com https://storage.googleapis.com https://*.firebasestorage.app; connect-src 'self' https://viacep.com.br https://*.googleapis.com https://*.firebaseio.com https://*.appspot.com https://*.firebasestorage.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HTML/JS/CSS sem cache: as atualizações aparecem na hora após cada deploy
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
