<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Relatório de Equipamentos — Grupo R&amp;T</title>
<link rel="icon" href="img/logo-rt.png">
<style>
  :root {
    --tinta:#0F172A; --papel:#FFFFFF; --fundo:#EEF2F7;
    --azul:#1E40AF; --azul-claro:#EFF4FF;
    --cinza:#5A6B7F; --linha:#E2E8F0; --verde:#059669; --ambar:#B45309;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:24px 16px 48px; background:var(--fundo);
    font-family:var(--sans); color:var(--tinta); -webkit-font-smoothing:antialiased;
  }
  .folha { max-width:1000px; margin:0 auto; }

  header.topo {
    background:var(--papel); border-radius:16px; padding:22px 26px; margin-bottom:16px;
    box-shadow:0 4px 18px rgba(15,23,42,.07); border:1px solid var(--linha);
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  header.topo img { height:52px; width:auto; }
  .topo-txt h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
  .topo-txt p { margin:4px 0 0; font-size:13.5px; color:var(--cinza); }
  .topo-meta { margin-left:auto; text-align:right; font-size:12.5px; color:var(--cinza); }
  .topo-meta b { color:var(--tinta); font-variant-numeric:tabular-nums; }

  .resumo { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .resumo div {
    flex:1 1 170px; background:var(--papel); border:1px solid var(--linha);
    border-left:4px solid var(--azul); border-radius:12px; padding:13px 16px;
  }
  .resumo span { display:block; font-size:11px; font-weight:800; text-transform:uppercase;
                 letter-spacing:.06em; color:var(--cinza); }
  .resumo b { display:block; margin-top:4px; font-size:22px; font-variant-numeric:tabular-nums; }

  .barra { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .barra input {
    flex:1 1 260px; padding:11px 14px; font-size:15px; border:1px solid var(--linha);
    border-radius:10px; background:var(--papel); font-family:inherit; min-height:44px;
  }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; min-height:44px; border:0; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:700; background:var(--azul); color:#fff;
  }
  .btn.sec { background:var(--papel); color:var(--tinta); border:1px solid var(--linha); }
  .btn:hover { filter:brightness(1.06); }

  .pessoa {
    background:var(--papel); border:1px solid var(--linha); border-radius:14px;
    margin-bottom:12px; overflow:hidden;
  }
  /* Recado da R&T para a empresa — classe própria, para não ser contado
     junto com os cartões de colaborador. */
  .recado {
    background:var(--azul-claro); border:1px solid #C7D9FF; border-left:4px solid var(--azul);
    border-radius:12px; padding:14px 18px; margin-bottom:16px;
    font-size:13.5px; line-height:1.6; color:var(--tinta);
  }
  .pessoa-cab {
    display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer; flex-wrap:wrap;
  }
  .pessoa-cab:hover { background:#F8FAFC; }
  .avatar {
    width:42px; height:42px; flex:0 0 auto; border-radius:50%; background:var(--azul-claro);
    color:var(--azul); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px;
  }
  .pessoa-nome { font-size:16px; font-weight:700; }
  .pessoa-sub { font-size:12.5px; color:var(--cinza); margin-top:2px; }
  .selo {
    padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:800; white-space:nowrap;
  }
  .selo-entrega  { background:#EFF4FF; color:var(--azul); }
  .selo-devolucao{ background:#ECFDF5; color:var(--verde); }
  .pessoa-acao { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .qtd-fotos { font-size:12px; color:var(--cinza); }
  .ver-mais {
    background:none; border:1px solid var(--linha); border-radius:8px; padding:7px 13px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--azul); cursor:pointer; min-height:38px;
  }
  .detalhe { display:none; padding:0 18px 18px; border-top:1px solid var(--linha); }
  .detalhe.aberto { display:block; }
  .campos {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:10px 20px; margin:14px 0; font-size:13.5px; line-height:1.5;
  }
  .campos b { display:block; font-size:11px; font-weight:800; text-transform:uppercase;
              letter-spacing:.05em; color:var(--cinza); margin-bottom:2px; }
  .fotos { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .fotos a { display:block; border:1px solid var(--linha); border-radius:10px; overflow:hidden; background:#F8FAFC; }
  .fotos img { width:100%; height:130px; object-fit:cover; display:block; }
  .fotos .pdf {
    height:130px; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--ambar); text-align:center; padding:10px;
  }
  .foto-nome { font-size:11px; padding:6px 8px; color:var(--cinza); word-break:break-all; }

  .vazio, .erro {
    background:var(--papel); border:1px solid var(--linha); border-radius:14px;
    padding:40px 24px; text-align:center; color:var(--cinza);
  }
  .erro { border-color:#FECACA; color:#B91C1C; }
  .rodape { margin-top:22px; text-align:center; font-size:12px; color:var(--cinza); line-height:1.6; }

  /* ── Portaria: pede o nome antes de mostrar o relatório ─────────────── */
  .portaria {
    max-width:460px; margin:8vh auto; background:var(--papel); border:1px solid var(--linha);
    border-radius:18px; padding:34px 30px; text-align:center;
    box-shadow:0 10px 34px rgba(15,23,42,.10);
  }
  .portaria-logo { height:54px; width:auto; margin-bottom:16px; }
  .portaria h1 { margin:0 0 8px; font-size:24px; letter-spacing:-.02em; }
  .portaria-txt { margin:0 0 22px; font-size:14.5px; line-height:1.6; color:var(--cinza); }
  .portaria-rot {
    display:block; text-align:left; font-size:11.5px; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; color:var(--cinza); margin-bottom:6px;
  }
  .portaria input {
    width:100%; padding:13px 15px; font-size:16px; font-family:inherit;
    border:1.5px solid var(--linha); border-radius:10px; margin-bottom:6px; min-height:48px;
  }
  .portaria input:focus { outline:2px solid var(--azul); outline-offset:1px; border-color:var(--azul); }
  .portaria .btn { width:100%; margin-top:10px; font-size:15px; min-height:48px; }
  .portaria-erro { color:#B91C1C; font-size:13px; min-height:18px; text-align:left; }
  .portaria-nota { margin:16px 0 0; font-size:12px; color:var(--cinza); line-height:1.6; }

  /* ── Conferência ──────────────────────────────────────────────────────── */
  .aviso-conf {
    background:var(--azul-claro); border:1px solid #C7D9FF; border-radius:12px;
    padding:13px 18px; margin-bottom:16px; font-size:14px; line-height:1.6;
  }
  .feito-conf {
    background:#ECFDF5; border:1px solid #A7F3D0; border-left:5px solid var(--verde);
    border-radius:12px; padding:14px 18px; margin-bottom:16px;
  }
  .feito-conf.com-pendencia { background:#FFFBEB; border-color:#FDE68A; border-left-color:var(--ambar); }
  .feito-titulo { font-weight:800; font-size:15px; color:var(--verde); margin-bottom:5px; }
  .feito-conf.com-pendencia .feito-titulo { color:var(--ambar); }
  .feito-txt { font-size:13.5px; line-height:1.6; color:var(--tinta); }

  .confere {
    background:#F8FAFC; border:1px solid var(--linha); border-radius:10px;
    padding:11px 13px; margin:14px 0;
  }
  .confere-rot { font-size:12px; font-weight:800; color:var(--cinza); margin-bottom:8px;
                 text-transform:uppercase; letter-spacing:.05em; }
  .confere-botoes { display:flex; gap:8px; flex-wrap:wrap; }
  .cf {
    flex:1 1 130px; padding:10px 14px; min-height:44px; border-radius:9px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:700; background:var(--papel);
    border:1.5px solid var(--linha); color:var(--tinta);
  }
  .cf:disabled { opacity:.55; cursor:default; }
  .cf-sim.ativo { background:var(--verde); border-color:var(--verde); color:#fff; }
  .cf-nao.ativo { background:#DC2626; border-color:#DC2626; color:#fff; }
  .confere-motivo {
    width:100%; margin-top:9px; padding:10px 12px; font-size:14px; font-family:inherit;
    border:1.5px solid #FCA5A5; border-radius:9px; min-height:44px;
  }

  .acao-conf {
    background:var(--papel); border:2px solid var(--azul); border-radius:14px;
    padding:18px; margin-top:18px; box-shadow:0 6px 20px rgba(30,64,175,.10);
  }
  .acao-conf-topo {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; margin-bottom:12px; font-size:14.5px;
  }
  .acao-conf textarea {
    width:100%; min-height:74px; padding:11px 13px; font-size:14.5px; font-family:inherit;
    border:1px solid var(--linha); border-radius:10px; resize:vertical; margin-bottom:12px;
  }
  .acao-conf .btn { width:100%; font-size:15.5px; min-height:50px; }
  .acao-conf-nota { margin:10px 0 0; font-size:12.5px; color:var(--cinza); text-align:center; }

  @media (max-width:640px) {
    .portaria { margin:4vh auto; padding:26px 20px; }
    .cf { flex:1 1 100%; }
    body { padding:14px 10px 36px; }
    header.topo { padding:16px; }
    .topo-meta { margin-left:0; text-align:left; width:100%; }
    .pessoa-acao { margin-left:0; width:100%; justify-content:space-between; }
    .fotos { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
  }
  /* Aviso de que quem está vendo é da R&T, e não a empresa cliente */
  .interno {
    background:#FFFBEB; border:1px solid #FDE68A; border-left:4px solid var(--ambar);
    border-radius:12px; padding:13px 18px; margin-bottom:16px; font-size:13.5px; line-height:1.55;
  }
  .interno b { color:var(--ambar); }

  /* ══════════════════════════════════════════════════════════════════════
     FOLHA DE IMPRESSÃO — TERMO DE ENTREGA
     ----------------------------------------------------------------------
     O motoboy leva esta folha junto com o material. A empresa confere item
     por item, aponta ressalvas se houver e assina. Sai enxuta de propósito:
     sem fotos, muita gente por página. O relatório completo com as fotos
     continua disponível pelo botão "Imprimir com fotos".
     ══════════════════════════════════════════════════════════════════════ */
  #termo { display:none; }
  @media print {
    @page { size:A4 portrait; margin:11mm 10mm 12mm; }
    body { background:#fff; padding:0; margin:0; }
    .folha { max-width:none; }
    /* Padrão (inclusive Ctrl+P): sai o termo */
    #conteudo { display:none !important; }
    #termo { display:block !important; }
    /* Com fotos, só quando pedido pelo botão */
    body.imprimir-tudo #conteudo { display:block !important; }
    body.imprimir-tudo #termo { display:none !important; }
    body.imprimir-tudo .barra,
    body.imprimir-tudo .ver-mais,
    body.imprimir-tudo .acao-conf,
    body.imprimir-tudo .confere { display:none !important; }
    body.imprimir-tudo .detalhe { display:block !important; }
    body.imprimir-tudo .pessoa { break-inside:avoid; }
  }
  #termo { color:#000; font-size:9.5pt; line-height:1.35; }
  .t-cab { display:flex; align-items:center; gap:12px; border-bottom:1.5pt solid #000;
           padding-bottom:7pt; margin-bottom:9pt; }
  .t-cab img { height:36px; width:auto; flex:0 0 auto; }
  .t-cab > div:first-of-type { flex:1 1 auto; min-width:0; }
  .t-cab h1 { margin:0; font-size:10.5pt; text-transform:uppercase; letter-spacing:.01em; line-height:1.25; }
  .t-cab p { margin:2pt 0 0; font-size:8.5pt; }
  .t-meta { margin-left:auto; text-align:right; font-size:8.5pt; line-height:1.5;
            flex:0 0 auto; white-space:nowrap; }
  .t-info { display:flex; flex-wrap:wrap; gap:3pt 22pt; font-size:9pt; margin-bottom:8pt; }
  table.t-tab { width:100%; border-collapse:collapse; font-size:8.5pt; }
  table.t-tab thead { display:table-header-group; }
  table.t-tab th, table.t-tab td { border:.6pt solid #555; padding:2.1pt 4pt;
                                   text-align:left; vertical-align:top; }
  table.t-tab th { background:#E9E9E9; font-size:8pt; text-transform:uppercase; letter-spacing:.03em; }
  table.t-tab tr { break-inside:avoid; }
  .t-num { width:20pt; text-align:center; }
  .t-ok { width:32pt; text-align:center; }
  .t-cpf, .t-tipo, .t-estado { white-space:nowrap; }
  .t-quadro { display:inline-block; width:10pt; height:10pt; border:.8pt solid #000; }
  .t-termo { margin-top:8pt; font-size:8.2pt; line-height:1.36; text-align:justify; break-inside:avoid; }
  .t-termo h2 { font-size:9pt; margin:0 0 4pt; text-transform:uppercase; }
  .t-termo p { margin:0 0 4pt; }
  .t-termo ol { margin:0 0 4pt; padding-left:13pt; }
  .t-termo li { margin-bottom:2pt; }
  .t-ressalva { margin-top:7pt; break-inside:avoid; font-size:8.2pt; }
  .t-linha { border-bottom:.6pt solid #000; height:12pt; margin-top:2pt; }
  .t-assina { display:flex; gap:26pt; margin-top:11pt; break-inside:avoid; }
  .t-assina > div { flex:1; }
  .t-risco { border-top:.8pt solid #000; margin-top:26pt; padding-top:3pt; font-size:8pt; line-height:1.55; }
  .t-rod { margin-top:8pt; padding-top:3pt; border-top:.5pt solid #999;
           font-size:7.5pt; text-align:center; color:#333; }
</style>
</head>
<body>
<div class="folha">
  <div id="conteudo">
    <div class="vazio">Carregando o relatório…</div>
  </div>
  <!-- Folha do termo de entrega: invisível na tela, é o que sai na impressão -->
  <div id="termo"></div>
</div>

<script>
(function () {
  'use strict';
  var ITENS = {
    yubico:'Yubico', cartao_acesso:'Cartão de acesso', bota:'Bota',
    uniforme:'Uniforme', colete:'Colete', outros:'Outros'
  };
  var ESTADOS = { bom:'Bom', regular:'Regular', ruim:'Ruim', danificado:'Danificado' };
  var TIPOS = { entrega:'Entrega', devolucao:'Devolução' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function dataBR(iso) {
    if (!iso) return '—';
    var d = new Date(iso); if (isNaN(d)) return '—';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function iniciais(nome) {
    return String(nome || '?').trim().split(/\s+/).slice(0, 2).map(function (n) { return n[0] || ''; }).join('').toUpperCase();
  }
  function ehImagem(arq) { return /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(String(arq || '')); }
  function nomesItens(r) {
    var l = (r.equipamentos || []).map(function (k) { return ITENS[k] || k; });
    if (r.equipamentoOutros) l.push(r.equipamentoOutros);
    return l.join(', ') || '—';
  }

  var dados = null;
  var visitante = '';          // nome de quem abriu (portaria)
  var interno = false;         // true = quem abriu é da R&T (já logado no sistema)
  var conferencia = {};        // { idDoRegistro: {ok:bool, motivo:string} }
  var abertos = {};            // fichas expandidas, para não fecharem ao remarcar

  // ══════════════════════════════════════════════════════════════════════
  // TERMO DE ENTREGA (folha que o motoboy leva para a empresa assinar)
  // ══════════════════════════════════════════════════════════════════════
  // Número de protocolo legível, derivado da emissão: RT-EQ-20260805-1432
  function protocolo(iso) {
    var d = new Date(iso); if (isNaN(d)) d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return 'RT-EQ-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
           '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function montarTermo() {
    var el = document.getElementById('termo');
    if (!el || !dados) return;
    var regs = dados.registros || [];
    var entregas = regs.filter(function (r) { return r.tipo === 'entrega'; }).length;
    var devolucoes = regs.filter(function (r) { return r.tipo === 'devolucao'; }).length;

    // A declaração muda conforme o que está na lista: só entrega, só devolução
    // ou as duas coisas. Assim o texto nunca diz "recebeu" para item que volta.
    var declara;
    if (devolucoes === 0) {
      declara = 'recebeu do <b>GRUPO R&amp;T</b> os equipamentos e Equipamentos de Proteção Individual (EPI) ' +
        'discriminados na relação que integra este termo, referentes aos colaboradores nela identificados';
    } else if (entregas === 0) {
      declara = 'restituiu ao <b>GRUPO R&amp;T</b> os equipamentos e Equipamentos de Proteção Individual (EPI) ' +
        'discriminados na relação que integra este termo, referentes aos colaboradores nela identificados';
    } else {
      declara = 'conferiu a movimentação de equipamentos e Equipamentos de Proteção Individual (EPI) ' +
        'discriminada na relação que integra este termo, <b>recebendo</b> do <b>GRUPO R&amp;T</b> os itens ' +
        'assinalados como &ldquo;Entrega&rdquo; e <b>restituindo</b> os assinalados como &ldquo;Devolução&rdquo;, ' +
        'referentes aos colaboradores nela identificados';
    }

    var linhas = regs.map(function (r, i) {
      return '<tr>' +
        '<td class="t-num">' + (i + 1) + '</td>' +
        '<td>' + esc(r.nome || '—') + '</td>' +
        '<td class="t-cpf">' + esc(r.cpf || '—') + '</td>' +
        '<td class="t-tipo">' + esc(TIPOS[r.tipo] || r.tipo || '—') + '</td>' +
        '<td>' + esc(nomesItens(r)) + '</td>' +
        '<td class="t-estado">' + esc(ESTADOS[r.estado] || r.estado || '—') + '</td>' +
        '<td class="t-ok"><span class="t-quadro"></span></td>' +
      '</tr>';
    }).join('');

    el.innerHTML =
      '<div class="t-cab">' +
        '<img src="img/logo-rt.png" alt="Grupo R&amp;T">' +
        '<div>' +
          '<h1>Termo de entrega e conferência de equipamentos e EPI</h1>' +
          '<p>Grupo R&amp;T &middot; Terceirização de mão de obra</p>' +
        '</div>' +
        '<div class="t-meta">' +
          'Protocolo <b>' + esc(protocolo(dados.criadoEm)) + '</b><br>' +
          'Emitido em ' + dataBR(dados.criadoEm) +
          (dados.criadoPor ? '<br>por ' + esc(dados.criadoPor) : '') +
        '</div>' +
      '</div>' +

      '<div class="t-info">' +
        '<div><b>Destinatário:</b> ' + esc(dados.empresaDestino || '—') + '</div>' +
        '<div><b>Referência:</b> ' + esc(dados.titulo || '—') + '</div>' +
        '<div><b>Colaboradores:</b> ' + regs.length + '</div>' +
        (entregas ? '<div><b>Entregas:</b> ' + entregas + '</div>' : '') +
        (devolucoes ? '<div><b>Devoluções:</b> ' + devolucoes + '</div>' : '') +
      '</div>' +
      (dados.observacao ? '<div class="t-info"><div><b>Observação:</b> ' + esc(dados.observacao) + '</div></div>' : '') +

      '<table class="t-tab">' +
        '<thead><tr>' +
          '<th class="t-num">#</th><th>Colaborador</th><th class="t-cpf">CPF</th>' +
          '<th class="t-tipo">Operação</th><th>Equipamentos / EPI</th>' +
          '<th class="t-estado">Estado</th><th class="t-ok">Confere</th>' +
        '</tr></thead>' +
        '<tbody>' + (linhas || '<tr><td colspan="7">Sem itens relacionados.</td></tr>') + '</tbody>' +
      '</table>' +

      '<div class="t-termo">' +
        '<h2>Declaração de recebimento e conferência</h2>' +
        '<p>Pelo presente instrumento, o signatário abaixo identificado, na qualidade de responsável ' +
        'pelo recebimento em nome da empresa destinatária acima indicada, <b>DECLARA</b> que:</p>' +
        '<ol>' +
          '<li>' + declara + ';</li>' +
          '<li>conferiu, no ato do recebimento e na presença do portador, a quantidade, a descrição e o estado ' +
          'de conservação de cada item relacionado, encontrando-os em conformidade com o aqui descrito;</li>' +
          '<li>está ciente de que qualquer divergência, falta ou avaria deve ser registrada no campo ' +
          '<b>&ldquo;Ressalvas&rdquo;</b> deste documento <b>antes</b> da assinatura, valendo a assinatura sem ' +
          'ressalvas como reconhecimento da regularidade e da integralidade da entrega;</li>' +
          '<li>está ciente de que o fornecimento de EPI e o respectivo registro observam a Norma Regulamentadora ' +
          'nº 6 (NR-6) do Ministério do Trabalho e Emprego, que determina o registro do fornecimento ao ' +
          'trabalhador, e o art. 158, inciso II, da Consolidação das Leis do Trabalho, que obriga o empregado ' +
          'a utilizar o equipamento fornecido;</li>' +
          '<li>as declarações aqui prestadas presumem-se verdadeiras em relação ao signatário, nos termos do ' +
          'art. 219 do Código Civil, servindo o presente documento como recibo de entrega para os efeitos do ' +
          'art. 320 do mesmo diploma legal.</li>' +
        '</ol>' +
        '<p>E, por estar de acordo, firma o presente termo, do qual fica uma via com o Grupo R&amp;T. ' +
        'A relação completa, com as fotografias de cada item, permanece disponível para consulta no link ' +
        'de conferência enviado à empresa destinatária.</p>' +
      '</div>' +

      '<div class="t-ressalva">' +
        '<b>RESSALVAS</b> (preencher somente se houver divergência, falta ou avaria):' +
        '<div class="t-linha"></div><div class="t-linha"></div>' +
      '</div>' +

      '<div class="t-assina">' +
        '<div>' +
          '<div class="t-risco">' +
            '<b>ENTREGUE POR</b> — Grupo R&amp;T<br>' +
            'Nome: ______________________________<br>' +
            'CPF/RG: ____________________________<br>' +
            'Data: ____/____/________  Hora: ______' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="t-risco">' +
            '<b>RECEBIDO E CONFERIDO POR</b> — ' + esc(dados.empresaDestino || 'empresa destinatária') + '<br>' +
            'Nome: ______________________________<br>' +
            'CPF/RG: ____________________________<br>' +
            'Função: ____________________________<br>' +
            'Data: ____/____/________  Carimbo:' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="t-rod">' +
        'Documento gerado eletronicamente pelo sistema do Grupo R&amp;T &middot; Protocolo ' +
        esc(protocolo(dados.criadoEm)) + ' &middot; ' + regs.length + ' colaborador(es) relacionado(s).' +
      '</div>';
  }

  // Padrão da impressão é o termo. "Imprimir com fotos" liga o modo completo
  // só durante a impressão e desliga logo depois.
  window.imprimirTermo = function () {
    montarTermo();
    document.body.classList.remove('imprimir-tudo');
    window.print();
  };
  window.imprimirCompleto = function () {
    document.body.classList.add('imprimir-tudo');
    window.print();
  };
  window.addEventListener('afterprint', function () {
    document.body.classList.remove('imprimir-tudo');
  });

  function montar(filtro) {
    var q = String(filtro || '').trim().toLowerCase();
    var lista = dados.registros.filter(function (r) {
      return !q || String(r.nome || '').toLowerCase().indexOf(q) >= 0;
    });
    var entregas = dados.registros.filter(function (r) { return r.tipo === 'entrega'; }).length;
    var devolucoes = dados.registros.filter(function (r) { return r.tipo === 'devolucao'; }).length;
    var fotos = dados.registros.reduce(function (s, r) { return s + (r.fotos || []).length; }, 0);

    var html =
      '<header class="topo">' +
        '<img src="img/logo-rt.png" alt="Grupo R&amp;T">' +
        '<div class="topo-txt">' +
          '<h1>' + esc(dados.titulo) + '</h1>' +
          '<p>' + (dados.empresaDestino ? 'Para: <strong>' + esc(dados.empresaDestino) + '</strong>' : 'Relatório de entrega e devolução de equipamentos') + '</p>' +
        '</div>' +
        '<div class="topo-meta">' +
          'Emitido em <b>' + dataBR(dados.criadoEm) + '</b>' +
          (dados.criadoPor ? '<br>por ' + esc(dados.criadoPor) : '') +
        '</div>' +
      '</header>' +
      statusConferencia() +
      (dados.observacao ? '<div class="recado">' + esc(dados.observacao) + '</div>' : '') +
      '<div class="resumo">' +
        '<div><span>Colaboradores</span><b>' + dados.registros.length + '</b></div>' +
        '<div><span>Entregas</span><b>' + entregas + '</b></div>' +
        '<div><span>Devoluções</span><b>' + devolucoes + '</b></div>' +
        '<div><span>Fotos anexadas</span><b>' + fotos + '</b></div>' +
      '</div>' +
      '<div class="barra">' +
        '<input id="busca" type="search" placeholder="Buscar colaborador pelo nome…" value="' + esc(filtro || '') + '">' +
        '<button class="btn" onclick="imprimirTermo()">Imprimir termo de entrega</button>' +
        '<button class="btn sec" onclick="imprimirCompleto()">Imprimir com fotos</button>' +
        '<button class="btn sec" onclick="abrirTodos()">Abrir todos</button>' +
      '</div>';

    if (!lista.length) {
      html += '<div class="vazio">Nenhum colaborador' + (q ? ' com esse nome' : '') + '.</div>';
    } else {
      html += lista.map(function (r, i) {
        var nf = (r.fotos || []).length;
        return '<article class="pessoa">' +
          '<div class="pessoa-cab" onclick="alternar(' + i + ', \'' + esc(r.id) + '\')">' +
            '<div class="avatar">' + esc(iniciais(r.nome)) + '</div>' +
            '<div>' +
              '<div class="pessoa-nome">' + esc(r.nome || '—') + '</div>' +
              '<div class="pessoa-sub">' + (r.cpf ? 'CPF ' + esc(r.cpf) + ' &middot; ' : '') + dataBR(r.dataCadastro) + '</div>' +
            '</div>' +
            '<span class="selo ' + (r.tipo === 'devolucao' ? 'selo-devolucao' : 'selo-entrega') + '">' +
              esc(TIPOS[r.tipo] || r.tipo || '—') + '</span>' +
            '<div class="pessoa-acao">' +
              '<span class="qtd-fotos">' + (nf ? nf + ' foto(s)' : 'sem foto') + '</span>' +
              '<button class="ver-mais" id="b' + i + '">' + (abertos[r.id] ? 'Ver menos' : 'Ver mais') + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="detalhe' + (abertos[r.id] ? ' aberto' : '') + '" id="d' + i + '">' +
            '<div class="campos">' +
              '<div><b>Equipamentos</b>' + esc(nomesItens(r)) + '</div>' +
              '<div><b>Estado</b>' + esc(ESTADOS[r.estado] || r.estado || '—') + '</div>' +
              '<div><b>Responsável R&amp;T</b>' + esc(r.responsavel || '—') + '</div>' +
              '<div><b>Data do registro</b>' + dataBR(r.dataCadastro) + '</div>' +
              (r.observacoes ? '<div style="grid-column:1/-1;"><b>Observações</b>' + esc(r.observacoes) + '</div>' : '') +
            '</div>' +
            confereBloco(r) +
            (nf
              ? '<div class="fotos">' + r.fotos.map(function (f) {
                  return '<a href="' + esc(f.arquivo) + '" target="_blank" rel="noopener">' +
                    (ehImagem(f.arquivo)
                      ? '<img src="' + esc(f.arquivo) + '" alt="' + esc(f.nome) + '" loading="lazy" decoding="async">'
                      : '<div class="pdf">Abrir arquivo</div>') +
                    '<div class="foto-nome">' + esc(f.nome || 'arquivo') + '</div></a>';
                }).join('') + '</div>'
              : '<div style="font-size:13px;color:var(--cinza);">Sem fotos anexadas neste registro.</div>') +
          '</div>' +
        '</article>';
      }).join('');
    }

    if (!dados.jaConferido && lista.length && !interno) {
      var marcados = Object.keys(conferencia).length;
      html += '<div class="acao-conf">' +
        '<div class="acao-conf-topo">' +
          '<div><b>' + marcados + ' de ' + dados.registros.length + '</b> item(ns) respondido(s)</div>' +
          '<button class="btn sec" onclick="confereTudo()">Confere tudo</button>' +
        '</div>' +
        '<textarea id="conf-obs" placeholder="Quer deixar alguma observação? (opcional)"></textarea>' +
        '<button class="btn" id="btn-enviar-conf" onclick="enviarConferencia()">Confirmar conferência</button>' +
        '<p class="acao-conf-nota">Ao confirmar, fica registrado que <b>' + esc(visitante) + '</b> conferiu este relatório.</p>' +
      '</div>';
    }
    html += '<div class="rodape">Documento gerado pelo sistema do <strong>Grupo R&amp;T</strong>.<br>' +
      'Este link é privado — compartilhe apenas com quem precisa consultar o relatório.</div>';

    document.getElementById('conteudo').innerHTML = html;
    var b = document.getElementById('busca');
    if (b) {
      b.addEventListener('input', function () { montar(this.value); });
      if (filtro) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
    }
  }

  // ── Conferência de cada pessoa ────────────────────────────────────────
  function statusConferencia() {
    // Quem é da R&T (já logado) vê em modo consulta: não assina pela empresa
    // e o acesso não entra no histórico como se a empresa tivesse aberto.
    var avisoInterno = interno
      ? '<div class="interno"><b>Visualização interna do Grupo R&amp;T.</b> ' +
        'Você está vendo o relatório exatamente como a empresa vai ver. Este acesso ' +
        'não é registrado no histórico e o aceite continua sendo só de quem receber. ' +
        'Use <b>&ldquo;Imprimir termo de entrega&rdquo;</b> para a folha que vai junto com o material.</div>'
      : '';
    if (!dados.jaConferido || !dados.ultimaConferencia) {
      return avisoInterno + (interno ? '' :
        '<div class="aviso-conf">' +
          '<b>Olá, ' + esc(visitante) + '!</b> Confira cada colaborador abaixo e, no fim, confirme a conferência.' +
        '</div>');
    }
    return avisoInterno + conferenciaFeita();
  }

  function conferenciaFeita() {
    var c = dados.ultimaConferencia;
    var tudo = c.naoConferidos === 0;
    return '<div class="feito-conf' + (tudo ? '' : ' com-pendencia') + '">' +
      '<div class="feito-titulo">' + (tudo ? 'Conferência concluída' : 'Conferência concluída com ressalvas') + '</div>' +
      '<div class="feito-txt">Por <b>' + esc(c.nome || '—') + '</b> em ' + dataHoraBR(c.em) + '<br>' +
        '<b>' + (c.conferidos || 0) + '</b> item(ns) conferido(s)' +
        (c.naoConferidos ? ' &middot; <b>' + c.naoConferidos + '</b> com ressalva' : '') +
        (c.observacao ? '<br>Observação: ' + esc(c.observacao) : '') + '</div>' +
    '</div>';
  }
  function dataHoraBR(iso) {
    if (!iso) return '—';
    var d = new Date(iso); if (isNaN(d)) return '—';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' às ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function confereBloco(r) {
    if (interno) return '';           // a R&T não confere no lugar da empresa
    var c = conferencia[r.id] || {};
    var jaEnviado = !!dados.jaConferido;
    var marcado = c.ok === true, recusado = c.ok === false;
    return '<div class="confere" data-id="' + esc(r.id) + '">' +
      '<div class="confere-rot">Este item confere?</div>' +
      '<div class="confere-botoes">' +
        '<button type="button" class="cf cf-sim' + (marcado ? ' ativo' : '') + '"' +
          (jaEnviado ? ' disabled' : '') + ' onclick="marcarItem(\'' + esc(r.id) + '\', true)">Confere</button>' +
        '<button type="button" class="cf cf-nao' + (recusado ? ' ativo' : '') + '"' +
          (jaEnviado ? ' disabled' : '') + ' onclick="marcarItem(\'' + esc(r.id) + '\', false)">Não confere</button>' +
      '</div>' +
      (recusado
        ? '<input class="confere-motivo" placeholder="O que está errado? (ex.: faltou a bota)" ' +
          'value="' + esc(c.motivo || '') + '" oninput="motivoItem(\'' + esc(r.id) + '\', this.value)">'
        : '') +
    '</div>';
  }

  window.marcarItem = function (id, ok) {
    if (dados.jaConferido) return;
    conferencia[id] = { ok: ok, motivo: (conferencia[id] || {}).motivo || '' };
    var f = document.getElementById('busca');
    montar(f ? f.value : '');
  };
  window.motivoItem = function (id, txt) {
    conferencia[id] = conferencia[id] || { ok: false };
    conferencia[id].motivo = txt;
  };
  window.confereTudo = function () {
    if (dados.jaConferido) return;
    dados.registros.forEach(function (r) { conferencia[r.id] = { ok: true, motivo: '' }; });
    var f = document.getElementById('busca');
    montar(f ? f.value : '');
  };

  window.enviarConferencia = function () {
    var total = dados.registros.length;
    var marcados = Object.keys(conferencia).length;
    if (marcados < total) {
      if (!confirm('Faltam ' + (total - marcados) + ' item(ns) sem resposta.\n\nEnviar assim mesmo?')) return;
    }
    var semMotivo = dados.registros.filter(function (r) {
      var c = conferencia[r.id]; return c && c.ok === false && !String(c.motivo || '').trim();
    });
    if (semMotivo.length) {
      alert('Explique o que está errado em: ' + semMotivo.map(function (r) { return r.nome; }).join(', '));
      return;
    }
    var btn = document.getElementById('btn-enviar-conf');
    if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
    fetch('/api/relatorio-equip/' + encodeURIComponent(token) + '/conferencia', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome: visitante, itens: conferencia,
        observacao: (document.getElementById('conf-obs') || {}).value || ''
      })
    }).then(function (r) { if (!r.ok) throw new Error('falhou'); return r.json(); })
      .then(function () {
        dados.jaConferido = true;
        dados.ultimaConferencia = {
          nome: visitante, em: new Date().toISOString(),
          conferidos: Object.keys(conferencia).filter(function (k) { return conferencia[k].ok; }).length,
          naoConferidos: Object.keys(conferencia).filter(function (k) { return !conferencia[k].ok; }).length,
          observacao: (document.getElementById('conf-obs') || {}).value || '',
          itens: conferencia
        };
        montar('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = 'Confirmar conferência'; }
        alert('Não consegui enviar agora. Verifique a internet e tente de novo.');
      });
  };

  // Quem está aberto fica guardado por colaborador: assim, ao marcar
  // "não confere" a ficha não se fecha na cara de quem está conferindo.
  window.alternar = function (i, id) {
    var d = document.getElementById('d' + i), b = document.getElementById('b' + i);
    if (!d) return;
    var abrindo = !d.classList.contains('aberto');
    d.classList.toggle('aberto', abrindo);
    if (b) b.textContent = abrindo ? 'Ver menos' : 'Ver mais';
    if (id) abertos[id] = abrindo;
  };
  window.abrirTodos = function () {
    var todos = document.querySelectorAll('.detalhe');
    var algumFechado = [].slice.call(todos).some(function (d) { return !d.classList.contains('aberto'); });
    [].slice.call(todos).forEach(function (d, i) {
      d.classList.toggle('aberto', algumFechado);
      var b = document.getElementById('b' + i);
      if (b) b.textContent = algumFechado ? 'Ver menos' : 'Ver mais';
    });
    (dados.registros || []).forEach(function (r) { abertos[r.id] = algumFechado; });
  };

  // O token vem no endereço: /relatorio-equip.html?r=TOKEN
  var token = new URLSearchParams(location.search).get('r') || '';
  if (!token) {
    document.getElementById('conteudo').innerHTML =
      '<div class="erro"><h2>Link incompleto</h2><p>Peça o link completo a quem enviou o relatório.</p></div>';
    return;
  }
  fetch('/api/relatorio-equip/' + encodeURIComponent(token), { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) throw new Error('Relatório não encontrado. Confira se o link está completo.');
      if (r.status === 410) throw new Error('Este relatório foi desativado por quem o gerou.');
      if (!r.ok) throw new Error('Não consegui carregar o relatório agora. Tente novamente em instantes.');
      return r.json();
    })
    .then(function (j) {
      dados = j;
      montarTermo();
      // Se quem abriu JÁ está logado no sistema, é gente da R&T conferindo o
      // próprio envio: entra direto, sem portaria e sem sujar o histórico.
      return fetch('/api/state/version', { cache: 'no-store', credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .catch(function () { return {}; })
        .then(function (v) {
          if (v && v.autenticado) {
            interno = true;
            montar('');
            // Atalho "Imprimir termo" vindo do sistema: já abre a impressão
            if (location.hash === '#imprimir') setTimeout(imprimirTermo, 400);
          } else {
            portaria();
          }
        });
    })
    .catch(function (e) {
      document.getElementById('conteudo').innerHTML =
        '<div class="erro"><h2>Não foi possível abrir</h2><p>' + esc(e.message) + '</p></div>';
    });

  // ── PORTARIA ────────────────────────────────────────────────────────────
  // Antes de mostrar o relatório, pede o nome de quem está abrindo. Serve de
  // comprovante: fica registrado quem viu e a que horas.
  function portaria() {
    document.getElementById('conteudo').innerHTML =
      '<div class="portaria">' +
        '<img src="img/logo-rt.png" alt="Grupo R&amp;T" class="portaria-logo">' +
        '<h1>Olá! Tudo bem?</h1>' +
        '<p class="portaria-txt">Para visualizar <b>' + esc(dados.titulo) + '</b>' +
          (dados.empresaDestino ? ', enviado para <b>' + esc(dados.empresaDestino) + '</b>' : '') +
          ', informe seu nome abaixo.</p>' +
        '<label class="portaria-rot" for="quem">Seu nome completo</label>' +
        '<input id="quem" type="text" placeholder="Ex.: Maria Oliveira" autocomplete="name">' +
        '<div class="portaria-erro" id="portaria-erro"></div>' +
        '<button class="btn" id="portaria-btn">Ver o relatório</button>' +
        '<p class="portaria-nota">Registramos apenas seu nome e o horário de acesso, ' +
          'para comprovar que o relatório foi recebido e conferido.</p>' +
      '</div>';
    var inp = document.getElementById('quem');
    var btn = document.getElementById('portaria-btn');
    var err = document.getElementById('portaria-erro');
    function entrar() {
      var nome = (inp.value || '').trim();
      if (nome.length < 3) { err.textContent = 'Escreva seu nome completo para continuar.'; inp.focus(); return; }
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Entrando…';
      fetch('/api/relatorio-equip/' + encodeURIComponent(token) + '/acesso', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome: nome })
      }).then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function () { visitante = nome; montar(''); })
        .catch(function () { visitante = nome; montar(''); });   // rede instável não pode barrar a leitura
    }
    btn.addEventListener('click', entrar);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
    inp.focus();
  }
})();
</script>
</body>
</html>
