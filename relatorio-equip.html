<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Relatório de Equipamentos — Grupo R&amp;T</title>
<link rel="icon" href="img/logo-rt.png">
<style>
  :root {
    --tinta:#0F172A; --papel:#FFFFFF; --fundo:#EEF2F7;
    --azul:#1E40AF; --azul-claro:#EFF4FF;
    --cinza:#5A6B7F; --linha:#E2E8F0; --verde:#059669; --ambar:#B45309;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:24px 16px 48px; background:var(--fundo);
    font-family:var(--sans); color:var(--tinta); -webkit-font-smoothing:antialiased;
  }
  .folha { max-width:1000px; margin:0 auto; }

  header.topo {
    background:var(--papel); border-radius:16px; padding:22px 26px; margin-bottom:16px;
    box-shadow:0 4px 18px rgba(15,23,42,.07); border:1px solid var(--linha);
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  header.topo img { height:52px; width:auto; }
  .topo-txt h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
  .topo-txt p { margin:4px 0 0; font-size:13.5px; color:var(--cinza); }
  .topo-meta { margin-left:auto; text-align:right; font-size:12.5px; color:var(--cinza); }
  .topo-meta b { color:var(--tinta); font-variant-numeric:tabular-nums; }

  .resumo { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .resumo div {
    flex:1 1 170px; background:var(--papel); border:1px solid var(--linha);
    border-left:4px solid var(--azul); border-radius:12px; padding:13px 16px;
  }
  .resumo span { display:block; font-size:11px; font-weight:800; text-transform:uppercase;
                 letter-spacing:.06em; color:var(--cinza); }
  .resumo b { display:block; margin-top:4px; font-size:22px; font-variant-numeric:tabular-nums; }

  .barra { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .barra input {
    flex:1 1 260px; padding:11px 14px; font-size:15px; border:1px solid var(--linha);
    border-radius:10px; background:var(--papel); font-family:inherit; min-height:44px;
  }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; min-height:44px; border:0; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:700; background:var(--azul); color:#fff;
  }
  .btn.sec { background:var(--papel); color:var(--tinta); border:1px solid var(--linha); }
  .btn:hover { filter:brightness(1.06); }

  .pessoa {
    background:var(--papel); border:1px solid var(--linha); border-radius:14px;
    margin-bottom:12px; overflow:hidden;
  }
  /* Recado da R&T para a empresa — classe própria, para não ser contado
     junto com os cartões de colaborador. */
  .recado {
    background:var(--azul-claro); border:1px solid #C7D9FF; border-left:4px solid var(--azul);
    border-radius:12px; padding:14px 18px; margin-bottom:16px;
    font-size:13.5px; line-height:1.6; color:var(--tinta);
  }
  .pessoa-cab {
    display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer; flex-wrap:wrap;
  }
  .pessoa-cab:hover { background:#F8FAFC; }
  .avatar {
    width:42px; height:42px; flex:0 0 auto; border-radius:50%; background:var(--azul-claro);
    color:var(--azul); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px;
  }
  .pessoa-nome { font-size:16px; font-weight:700; }
  .pessoa-sub { font-size:12.5px; color:var(--cinza); margin-top:2px; }
  .selo {
    padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:800; white-space:nowrap;
  }
  .selo-entrega  { background:#EFF4FF; color:var(--azul); }
  .selo-devolucao{ background:#ECFDF5; color:var(--verde); }
  .pessoa-acao { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .qtd-fotos { font-size:12px; color:var(--cinza); }
  .ver-mais {
    background:none; border:1px solid var(--linha); border-radius:8px; padding:7px 13px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--azul); cursor:pointer; min-height:38px;
  }
  .detalhe { display:none; padding:0 18px 18px; border-top:1px solid var(--linha); }
  .detalhe.aberto { display:block; }
  .campos {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:10px 20px; margin:14px 0; font-size:13.5px; line-height:1.5;
  }
  .campos b { display:block; font-size:11px; font-weight:800; text-transform:uppercase;
              letter-spacing:.05em; color:var(--cinza); margin-bottom:2px; }
  .fotos { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .fotos a { display:block; border:1px solid var(--linha); border-radius:10px; overflow:hidden; background:#F8FAFC; }
  .fotos img { width:100%; height:130px; object-fit:cover; display:block; }
  .fotos .pdf {
    height:130px; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--ambar); text-align:center; padding:10px;
  }
  .foto-nome { font-size:11px; padding:6px 8px; color:var(--cinza); word-break:break-all; }

  .vazio, .erro {
    background:var(--papel); border:1px solid var(--linha); border-radius:14px;
    padding:40px 24px; text-align:center; color:var(--cinza);
  }
  .erro { border-color:#FECACA; color:#B91C1C; }
  .rodape { margin-top:22px; text-align:center; font-size:12px; color:var(--cinza); line-height:1.6; }

  @media (max-width:640px) {
    body { padding:14px 10px 36px; }
    header.topo { padding:16px; }
    .topo-meta { margin-left:0; text-align:left; width:100%; }
    .pessoa-acao { margin-left:0; width:100%; justify-content:space-between; }
    .fotos { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
  }
  @media print {
    body { background:#fff; padding:0; }
    .barra, .ver-mais { display:none !important; }
    .detalhe { display:block !important; }
    .pessoa { break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="folha">
  <div id="conteudo">
    <div class="vazio">Carregando o relatório…</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var ITENS = {
    yubico:'Yubico', cartao_acesso:'Cartão de acesso', bota:'Bota',
    uniforme:'Uniforme', colete:'Colete', outros:'Outros'
  };
  var ESTADOS = { bom:'Bom', regular:'Regular', ruim:'Ruim', danificado:'Danificado' };
  var TIPOS = { entrega:'Entrega', devolucao:'Devolução' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function dataBR(iso) {
    if (!iso) return '—';
    var d = new Date(iso); if (isNaN(d)) return '—';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function iniciais(nome) {
    return String(nome || '?').trim().split(/\s+/).slice(0, 2).map(function (n) { return n[0] || ''; }).join('').toUpperCase();
  }
  function ehImagem(arq) { return /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(String(arq || '')); }
  function nomesItens(r) {
    var l = (r.equipamentos || []).map(function (k) { return ITENS[k] || k; });
    if (r.equipamentoOutros) l.push(r.equipamentoOutros);
    return l.join(', ') || '—';
  }

  var dados = null;

  function montar(filtro) {
    var q = String(filtro || '').trim().toLowerCase();
    var lista = dados.registros.filter(function (r) {
      return !q || String(r.nome || '').toLowerCase().indexOf(q) >= 0;
    });
    var entregas = dados.registros.filter(function (r) { return r.tipo === 'entrega'; }).length;
    var devolucoes = dados.registros.filter(function (r) { return r.tipo === 'devolucao'; }).length;
    var fotos = dados.registros.reduce(function (s, r) { return s + (r.fotos || []).length; }, 0);

    var html =
      '<header class="topo">' +
        '<img src="img/logo-rt.png" alt="Grupo R&amp;T">' +
        '<div class="topo-txt">' +
          '<h1>' + esc(dados.titulo) + '</h1>' +
          '<p>' + (dados.empresaDestino ? 'Para: <strong>' + esc(dados.empresaDestino) + '</strong>' : 'Relatório de entrega e devolução de equipamentos') + '</p>' +
        '</div>' +
        '<div class="topo-meta">' +
          'Emitido em <b>' + dataBR(dados.criadoEm) + '</b>' +
          (dados.criadoPor ? '<br>por ' + esc(dados.criadoPor) : '') +
        '</div>' +
      '</header>' +
      (dados.observacao ? '<div class="recado">' + esc(dados.observacao) + '</div>' : '') +
      '<div class="resumo">' +
        '<div><span>Colaboradores</span><b>' + dados.registros.length + '</b></div>' +
        '<div><span>Entregas</span><b>' + entregas + '</b></div>' +
        '<div><span>Devoluções</span><b>' + devolucoes + '</b></div>' +
        '<div><span>Fotos anexadas</span><b>' + fotos + '</b></div>' +
      '</div>' +
      '<div class="barra">' +
        '<input id="busca" type="search" placeholder="Buscar colaborador pelo nome…" value="' + esc(filtro || '') + '">' +
        '<button class="btn sec" onclick="window.print()">Imprimir / PDF</button>' +
        '<button class="btn sec" onclick="abrirTodos()">Abrir todos</button>' +
      '</div>';

    if (!lista.length) {
      html += '<div class="vazio">Nenhum colaborador' + (q ? ' com esse nome' : '') + '.</div>';
    } else {
      html += lista.map(function (r, i) {
        var nf = (r.fotos || []).length;
        return '<article class="pessoa">' +
          '<div class="pessoa-cab" onclick="alternar(' + i + ')">' +
            '<div class="avatar">' + esc(iniciais(r.nome)) + '</div>' +
            '<div>' +
              '<div class="pessoa-nome">' + esc(r.nome || '—') + '</div>' +
              '<div class="pessoa-sub">' + (r.cpf ? 'CPF ' + esc(r.cpf) + ' &middot; ' : '') + dataBR(r.dataCadastro) + '</div>' +
            '</div>' +
            '<span class="selo ' + (r.tipo === 'devolucao' ? 'selo-devolucao' : 'selo-entrega') + '">' +
              esc(TIPOS[r.tipo] || r.tipo || '—') + '</span>' +
            '<div class="pessoa-acao">' +
              '<span class="qtd-fotos">' + (nf ? nf + ' foto(s)' : 'sem foto') + '</span>' +
              '<button class="ver-mais" id="b' + i + '">Ver mais</button>' +
            '</div>' +
          '</div>' +
          '<div class="detalhe" id="d' + i + '">' +
            '<div class="campos">' +
              '<div><b>Equipamentos</b>' + esc(nomesItens(r)) + '</div>' +
              '<div><b>Estado</b>' + esc(ESTADOS[r.estado] || r.estado || '—') + '</div>' +
              '<div><b>Responsável R&amp;T</b>' + esc(r.responsavel || '—') + '</div>' +
              '<div><b>Data do registro</b>' + dataBR(r.dataCadastro) + '</div>' +
              (r.observacoes ? '<div style="grid-column:1/-1;"><b>Observações</b>' + esc(r.observacoes) + '</div>' : '') +
            '</div>' +
            (nf
              ? '<div class="fotos">' + r.fotos.map(function (f) {
                  return '<a href="' + esc(f.arquivo) + '" target="_blank" rel="noopener">' +
                    (ehImagem(f.arquivo)
                      ? '<img src="' + esc(f.arquivo) + '" alt="' + esc(f.nome) + '" loading="lazy" decoding="async">'
                      : '<div class="pdf">Abrir arquivo</div>') +
                    '<div class="foto-nome">' + esc(f.nome || 'arquivo') + '</div></a>';
                }).join('') + '</div>'
              : '<div style="font-size:13px;color:var(--cinza);">Sem fotos anexadas neste registro.</div>') +
          '</div>' +
        '</article>';
      }).join('');
    }

    html += '<div class="rodape">Documento gerado pelo sistema do <strong>Grupo R&amp;T</strong>.<br>' +
      'Este link é privado — compartilhe apenas com quem precisa consultar o relatório.</div>';

    document.getElementById('conteudo').innerHTML = html;
    var b = document.getElementById('busca');
    if (b) {
      b.addEventListener('input', function () { montar(this.value); });
      if (filtro) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
    }
  }

  window.alternar = function (i) {
    var d = document.getElementById('d' + i), b = document.getElementById('b' + i);
    if (!d) return;
    var abrindo = !d.classList.contains('aberto');
    d.classList.toggle('aberto', abrindo);
    if (b) b.textContent = abrindo ? 'Ver menos' : 'Ver mais';
  };
  window.abrirTodos = function () {
    var todos = document.querySelectorAll('.detalhe');
    var algumFechado = [].slice.call(todos).some(function (d) { return !d.classList.contains('aberto'); });
    [].slice.call(todos).forEach(function (d, i) {
      d.classList.toggle('aberto', algumFechado);
      var b = document.getElementById('b' + i);
      if (b) b.textContent = algumFechado ? 'Ver menos' : 'Ver mais';
    });
  };

  // O token vem no endereço: /relatorio-equip.html?r=TOKEN
  var token = new URLSearchParams(location.search).get('r') || '';
  if (!token) {
    document.getElementById('conteudo').innerHTML =
      '<div class="erro"><h2>Link incompleto</h2><p>Peça o link completo a quem enviou o relatório.</p></div>';
    return;
  }
  fetch('/api/relatorio-equip/' + encodeURIComponent(token), { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) throw new Error('Relatório não encontrado. Confira se o link está completo.');
      if (r.status === 410) throw new Error('Este relatório foi desativado por quem o gerou.');
      if (!r.ok) throw new Error('Não consegui carregar o relatório agora. Tente novamente em instantes.');
      return r.json();
    })
    .then(function (j) { dados = j; montar(''); })
    .catch(function (e) {
      document.getElementById('conteudo').innerHTML =
        '<div class="erro"><h2>Não foi possível abrir</h2><p>' + esc(e.message) + '</p></div>';
    });
})();
</script>
</body>
</html>
